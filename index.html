const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let L=0,cur="all";
try{L=localStorage.getItem("lang")==="en"?1:0}catch(e){}
const t=k=>(T[k]||["",""])[L];
const ytId=u=>{const m=/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/.exec(u||"");return m&&m[1]};

function chips(){const b=$("chips");b.textContent="";["all",...CATS].forEach(c=>{const n=c==="all"?ALL().length:ALL().filter(i=>i.cat===c).length;const x=el("button","chip",t(c)+" ("+n+")");x.type="button";x.setAttribute("aria-pressed",String(c===cur));x.onclick=()=>{cur=c;cards()};b.appendChild(x)})}
function cards(){chips();const b=$("cards"),q=$("q").value.trim().toLowerCase();b.textContent="";
 const list=ALL().filter(i=>(cur==="all"||i.cat===cur)&&(!q||((i.title||"")+" "+(i.body||"")).toLowerCase().includes(q))).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
 $("empty").hidden=list.length>0;
 list.forEach(i=>{const c=el("article","card"),id=ytId(i.yt),link=i.yt&&/^https:\/\//.test(i.yt)?i.yt:"";
  const src=i.img||(i.type==="post"&&i.file)||(id&&"https://i.ytimg.com/vi/"+id+"/hqdefault.jpg");
  const vf=i.vurl||(i.file&&i.type!=="post"?i.file:"");if(vf){const v=el("video");v.controls=true;v.preload="metadata";v.playsInline=true;v.src=vf;c.appendChild(v)}else if(src){const m=el("img");m.src=src;m.alt=i.title||"";m.loading="lazy";m.onerror=()=>m.remove();if(link){const a=el("a");a.href=link;a.target="_blank";a.rel="noopener";a.appendChild(m);c.appendChild(a)}else c.appendChild(m)}
  const d=el("div","b");d.append(el("span","badge t",t(i.type==="post"?"post":"video")),el("span","badge",t(i.cat)),el("h3",0,i.title||""));
  if(i.body)d.appendChild(el("p",0,i.body));
  if(link){const a=el("a","mini",t("watch"));a.href=link;a.target="_blank";a.rel="noopener";d.appendChild(a)}
  if(i.lid){const x=el("button","mini",t("del"));x.type="button";x.style.marginLeft="8px";x.onclick=async()=>{await idbDo("readwrite",q=>q.delete(i.lid));await loadLocal()};d.appendChild(x)}
  c.appendChild(d);b.appendChild(c)})}
function static_(){$("lgrid").textContent="";CATS.forEach(c=>{const i=el("div","item");i.append(el("h3",0,t(c)),el("p",0,t("d_"+c)));$("lgrid").appendChild(i)});
 $("faqs").textContent="";[1,2,3,4].forEach(n=>{const d=el("details");d.append(el("summary",0,t("q"+n)),el("p",0,t("a"+n)));$("faqs").appendChild(d)});
 const s=$("soc");s.textContent="";[["YouTube",CFG.YT],["Facebook",CFG.FB],["Telegram",CFG.TG],["WhatsApp",CFG.WA]].forEach(([n,u])=>{if(!u)return;const a=el("a","btn",n);a.href=u;a.target="_blank";a.rel="noopener";s.appendChild(a)});
 if(CFG.EMAIL){const a=el("a","btn","Email");a.href="mailto:"+CFG.EMAIL;s.appendChild(a)}}
function apply(){document.documentElement.lang=L?"en":"bn";document.title=L?"Shikhi Online | Learn easy, move ahead":"শিখি অনলাইন | Shikhi Online";$("lang").textContent=L?"বাংলা":"EN";
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
 $("ac").textContent="";CATS.forEach(c=>{const o=el("option",0,t(c));o.value=c;$("ac").appendChild(o)});
 for(const[id,k]of[["uc",CATS],["ut",["video","post"]]]){const sel=$(id);sel.textContent="";k.forEach(c=>{const o=el("option",0,t(c));o.value=c;sel.appendChild(o)})}
 static_();cards()}

$("lang").onclick=()=>{L=1-L;try{localStorage.setItem("lang",L?"en":"bn")}catch(e){}apply()};
$("th").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("theme",r.dataset.theme)}catch(e){}};
try{const s=localStorage.getItem("theme");if(s)document.documentElement.dataset.theme=s}catch(e){}

document.querySelectorAll("[data-yt]").forEach(a=>a.href=CFG.YT);

let REMOTE=[],LOCAL=[];const ALL=()=>CONTENT.concat(REMOTE,LOCAL);
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("shikhi",1);r.onupgradeneeded=()=>r.result.createObjectStore("v",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbDo(mode,fn){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction("v",mode),q=fn(tx.objectStore("v"));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error)})}
async function loadLocal(){try{const rows=await idbDo("readonly",s=>s.getAll());LOCAL=(rows||[]).map(r=>{const u=r.blob?URL.createObjectURL(r.blob):"";return{...r,blob:undefined,lid:r.id,vurl:r.type==="video"?u:"",img:r.type==="post"?u:""}});cards()}catch(e){}}
async function loadRemote(){try{const r=await fetch("content.json",{cache:"no-store"});if(r.ok){REMOTE=await r.json();cards()}}catch(e){}}
let S={};try{S=JSON.parse(localStorage.getItem("gh")||"{}")}catch(e){}
$("ur").value=S.repo||"";$("ut2").value=S.tok||"";
$("ur").oninput=$("ut2").oninput=()=>{S={repo:$("ur").value.trim(),tok:$("ut2").value.trim()};try{localStorage.setItem("gh",JSON.stringify(S))}catch(e){}};
const api=p=>"https://api.github.com/repos/"+S.repo+"/contents/"+p;
const hd=()=>({Authorization:"Bearer "+S.tok,Accept:"application/vnd.github+json"});
async function gh(p,b){const r=await fetch(api(p),{method:"PUT",headers:hd(),body:JSON.stringify(b)});if(!r.ok){let m="";try{m=(await r.json()).message}catch(e){}throw new Error("GitHub "+r.status+": "+m)}}
const b64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(f)});
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o,null,1))));
$("dots").onclick=e=>{e.stopPropagation();$("menu").hidden=!$("menu").hidden};
document.addEventListener("click",()=>{$("menu").hidden=true});
function openUp(sett){$("menu").hidden=true;$("um").textContent="";$("uset").open=!!sett;$("upd").showModal()}
$("m1").onclick=()=>openUp(false);$("m2").onclick=()=>openUp(true);$("uc2").onclick=()=>$("upd").close();
$("ut").onchange=()=>{$("uf").accept=$("ut").value==="video"?"video/*":"image/*"};
async function doUpload(mode){const m=$("um"),type=$("ut").value,cat=$("uc").value,title=$("utt").value.trim(),body=$("ub").value.trim(),yt=$("uy").value.trim(),f=$("uf").files[0];
 if(!title){m.textContent=t("needT");return}
 if(!f&&!yt){m.textContent=t("needF");return}
 const rec={type,cat,title,date:new Date().toISOString().slice(0,10)};if(body)rec.body=body;if(yt)rec.yt=yt;
 $("pub").disabled=$("loc").disabled=true;m.textContent=t("wait");
 try{
  if(mode==="loc"){rec.id="l"+Date.now();rec.blob=f||null;await idbDo("readwrite",s=>s.put(rec));await loadLocal()}
  else{if(!S.repo||!S.tok)throw new Error(t("needS"));if(f&&f.size>50*1048576)throw new Error(t("big"));
   if(f){const ext=(f.name.split(".").pop()||"bin").replace(/\W/g,"");const path="uploads/"+Date.now()+"."+ext;await gh(path,{message:"Add "+title,content:await b64(f)});rec.file=path}
   let sha,arr=[];const g=await fetch(api("content.json"),{headers:hd()});
   if(g.ok){const j=await g.json();sha=j.sha;arr=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,"")))))}
   arr.push(rec);await gh("content.json",{message:"Update content",content:enc(arr),sha});REMOTE=arr}
  cur=cat;$("q").value="";cards();$("upd").close();["uf","utt","ub","uy"].forEach(k=>$(k).value="");location.hash="#content"
 }catch(e){m.textContent=(e&&e.message)||t("err")}
 $("pub").disabled=$("loc").disabled=false}
$("pub").onclick=()=>doUpload("pub");$("loc").onclick=()=>doUpload("loc");
loadLocal();loadRemote();
apply();
</script>
